<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hCaptcha Widget</title>
<style>
  body { font-family: sans-serif; background: #fafafa; margin: 0; }
  #checkbox {
    display: flex; align-items: center; gap: 12px;
    width: 300px; height: 56px; border: 1px solid #ccc;
    border-radius: 8px; background: #fff; cursor: pointer;
    user-select: none; padding: 0 14px; box-sizing: border-box;
  }
  #checkbox[aria-checked="true"] { border-color: #4f46e5; background: #eef2ff; }
  .checkbox-holder {
    width: 24px; height: 24px; border: 2px solid #999; border-radius: 4px;
    display: inline-block;
  }
  #checkbox[aria-checked="true"] .checkbox-holder {
    background: #4f46e5; border-color: #4f46e5;
  }
  .label { font-size: 15px; color: #111; }
  #verification-button, .button-submit {
    margin-top: 12px; padding: 10px 16px; background: #4f46e5;
    color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .info-on, .info-off, .refresh-on, .refresh-off { display: none; }
  .refresh.button { margin-top: 8px; display: inline-block; cursor: pointer; }
  .hcaptcha-logo { display: inline-block; margin-top: 8px; }
</style>
</head>
<body aria-hidden="true">
  <h3>Wait! Are you human?</h3>
  <div id="checkbox" role="checkbox" aria-checked="false" tabindex="0">
    <div class="checkbox-holder"></div>
    <div class="label">I am human</div>
  </div>
  <button id="verification-button" class="button-submit" disabled>Verify</button>
  <div id="menu-info" aria-hidden="true">menu</div>
  <div class="refresh button" tabindex="0" role="button" aria-label="Refresh Challenge.">
    <div class="refresh-on" aria-hidden="true"></div>
    <div class="refresh-off" aria-hidden="true"></div>
  </div>
  <a class="hcaptcha-logo" target="_blank" href="https://www.hcaptcha.com">hCaptcha logo</a>
  <script>
    window.__hcaptchaClicked = { mousedown: 0, mouseup: 0, click: 0, jsclick: 0, pointerdown: 0 };
    window.__hcaptchaFlipped = false;
    function flip() {
      const cb = document.getElementById('checkbox');
      cb.setAttribute('aria-checked', 'true');
      document.getElementById('verification-button').disabled = false;
      window.__hcaptchaFlipped = true;
      document.body.setAttribute('aria-hidden', 'false');
    }
    const cb = document.getElementById('checkbox');
    cb.addEventListener('pointerdown', function () { window.__hcaptchaClicked.pointerdown += 1; });
    cb.addEventListener('mousedown', function () { window.__hcaptchaClicked.mousedown += 1; });
    cb.addEventListener('mouseup', function () { window.__hcaptchaClicked.mouseup += 1; });
    cb.addEventListener('click', function (e) {
      window.__hcaptchaClicked.click += 1;
      if (e.isTrusted) flip();
    });
    document.getElementById('verification-button').addEventListener('click', function () { flip(); });
  </script>
</body>
</html>
